<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>s1nkhole — Systems &amp; Security Engineer</title>
<meta name="description" content="s1nkhole: an interactive terminal portfolio covering capability-isolated operating systems, security tooling, and firmware projects.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e1114;
  --panel: #181d22;
  --border: #2a3339;
  --border-soft: #21282e;
  --text: #e7ecee;
  --text-dim: #8b98a3;
  --text-faint: #5c6870;
  --accent: #e8963c;
  --accent-2: #4fb4a8;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  -webkit-font-smoothing: antialiased;
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

a { color: var(--accent-2); text-decoration: none; }
a:hover { text-decoration: underline; }

.term-window {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 900px;
  margin: 0 auto;
  border-left: 1px solid var(--border-soft);
  border-right: 1px solid var(--border-soft);
}

.term-chrome {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); }
.dot.d1 { background: var(--text-faint); }
.dot.d2 { background: var(--accent-2); }
.dot.d3 { background: var(--accent); }

.term-title {
  margin-left: 10px;
  font-size: 12px;
  color: var(--text-faint);
}

.term-output {
  flex: 1;
  overflow-y: auto;
  padding: 22px 18px 8px;
  font-size: 14px;
  line-height: 1.75;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.term-output::-webkit-scrollbar { width: 8px; }
.term-output::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.line {
  white-space: pre-wrap;
  word-break: break-word;
  margin-bottom: 2px;
}

.line.gap { margin-bottom: 16px; }
.line.echo { color: var(--text-faint); }
.line.echo .ps1 { color: var(--accent-2); }
.line.dim { color: var(--text-dim); }
.line.faint { color: var(--text-faint); }
.line.ok { color: var(--accent-2); }
.line.warn { color: var(--accent); }
.line.pre {
  color: var(--accent-2);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 10px 14px;
  margin: 6px 0 14px;
  overflow-x: auto;
}

.kv { display: flex; gap: 14px; }
.kv .k { min-width: 96px; color: var(--accent-2); flex-shrink: 0; }
.kv .v { color: var(--text); }
.kv .v.accent { color: var(--accent); }

.term-inputline {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 18px;
  border-top: 1px solid var(--border-soft);
  flex-shrink: 0;
}

.ps1 { color: var(--accent-2); font-size: 14px; white-space: nowrap; }

#cmd {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: var(--mono);
  font-size: 14px;
  caret-color: var(--accent);
}

.term-chips {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  padding: 0 18px 16px;
  flex-shrink: 0;
}

.term-chips button {
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-family: var(--mono);
  font-size: 12px;
  padding: 6px 11px;
  border-radius: 3px;
  cursor: pointer;
}

.term-chips button:hover { color: var(--text); border-color: var(--accent-2); }

@media (max-width: 600px) {
  .term-output { font-size: 13px; padding: 16px 14px 6px; }
  .term-inputline { padding: 10px 14px; }
  .term-chips { padding: 0 14px 14px; }
  .kv .k { min-width: 78px; }
}
</style>
</head>
<body>
<div class="term-window">
  <div class="term-chrome">
    <span class="dot d1"></span>
    <span class="dot d2"></span>
    <span class="dot d3"></span>
    <span class="term-title">guest@s1nkhole: ~</span>
  </div>
  <div class="term-output" id="output"></div>
  <div class="term-inputline">
    <span class="ps1">guest@s1nkhole:~$</span>
    <input id="cmd" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
  </div>
  <div class="term-chips">
    <button data-cmd="help">help</button>
    <button data-cmd="whoami">whoami</button>
    <button data-cmd="work">work</button>
    <button data-cmd="skills">skills</button>
    <button data-cmd="lab">lab</button>
    <button data-cmd="contact">contact</button>
  </div>
</div>
<script>
var output = document.getElementById('output');
var input = document.getElementById('cmd');
var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var history = [];
var historyIndex = -1;

function scrollDown() {
  output.scrollTop = output.scrollHeight;
}

function printText(text, cls) {
  var div = document.createElement('div');
  div.className = 'line' + (cls ? ' ' + cls : '');
  div.textContent = text;
  output.appendChild(div);
  scrollDown();
}

function printPre(text) {
  var div = document.createElement('div');
  div.className = 'line pre';
  div.textContent = text;
  output.appendChild(div);
  scrollDown();
}

function printKV(label, value, accentValue) {
  var row = document.createElement('div');
  row.className = 'kv';
  var k = document.createElement('span');
  k.className = 'k';
  k.textContent = label;
  var v = document.createElement('span');
  v.className = 'v' + (accentValue ? ' accent' : '');
  v.textContent = value;
  row.appendChild(k);
  row.appendChild(v);
  output.appendChild(row);
  scrollDown();
}

function printGap() {
  var div = document.createElement('div');
  div.className = 'line gap';
  output.appendChild(div);
}

function printLink(prefix, url) {
  var div = document.createElement('div');
  div.className = 'line';
  var a = document.createElement('a');
  a.href = url;
  a.textContent = url;
  a.target = '_blank';
  a.rel = 'noopener';
  div.appendChild(document.createTextNode(prefix));
  div.appendChild(a);
  output.appendChild(div);
  scrollDown();
}

function wait(ms) {
  return new Promise(function (resolve) { setTimeout(resolve, ms); });
}

var PROJECTS = {
  capguardos: {
    aliases: ['capguardos', 'capguard', 'os'],
    name: 'CapGuardOS',
    status: 'private repository -- active development',
    summary: 'Capability-isolated OS on seL4 (C)',
    run: function () {
      printText('CapGuardOS', 'ok');
      printText(PROJECTS.capguardos.status, 'faint');
      printGap();
      printText('A capability-isolated operating system in C, built on the seL4 microkernel.', 'dim');
      printText('Aimed at two use cases: workstations that need to keep secrets -- password', 'dim');
      printText('managers, crypto wallets, signing keys -- genuinely isolated, and purpose-built', 'dim');
      printText('secure devices like HSMs and secure terminals. Every component runs with only', 'dim');
      printText('the authority it needs, so a compromised process gets a small, explicit set of', 'dim');
      printText('capabilities instead of the whole machine.', 'dim');
      printPre('root (dispatcher + fault supervisor)\n  -> console  (owns serial, highest priority)\n  -> shell    (IPC only, no serial capability)\n  -> worker / storage (isolated services)');
      printText('1) root process boots and prints over serial', 'dim');
      printText('2) allocator, VKA, and VSpace initialized', 'dim');
      printText('3) first isolated child process, over an IPC endpoint', 'dim');
      printText('4) real serial I/O moved to a dedicated console component', 'dim');
      printText('5) interactive shell with command history and cursor editing', 'dim');
      printText('6) fault supervisor: badged fault endpoints let root identify which', 'dim');
      printText('   component crashed, without taking the rest of the system down', 'dim');
      printText('7) storage service: an isolated in-memory filesystem, reachable only', 'dim');
      printText('   through a narrow IPC protocol', 'dim');
      printGap();
      printText('CI builds from a clean checkout and boot-smoke-tests every component in QEMU', 'dim');
      printText('on every push. A Dockerfile reproduces the full toolchain on any host.', 'dim');
    }
  },
  uptime: {
    aliases: ['uptime-monitor', 'uptime', 'monitor'],
    name: 'url-uptime-monitor',
    status: 'public',
    summary: 'Health-check aggregator with full observability',
    run: function () {
      printText('url-uptime-monitor', 'ok');
      printText(PROJECTS.uptime.status, 'faint');
      printGap();
      printText('A health-check aggregator with a REST API, background polling, and full', 'dim');
      printText('observability. Polls a set of target URLs on a schedule, stores the check', 'dim');
      printText('history, and exposes results through a FastAPI + SQLAlchemy REST API.', 'dim');
      printText('Metrics feed into Prometheus and Grafana, infrastructure is defined in', 'dim');
      printText('Terraform, and CI runs lint and test on every push. Built as a portfolio', 'dim');
      printText('project for an SRE internship interview.', 'dim');
      printGap();
      printLink('repo: ', 'https://github.com/s1nkhole/url-uptime-monitor');
    }
  },
  network: {
    aliases: ['network-lab', 'network', 'netlab'],
    name: 'Networking lab project',
    status: 'public -- graded 100/100',
    summary: 'VLSM subnetting, GNS3 topology, Wireshark analysis',
    run: function () {
      printText('Networking lab project', 'ok');
      printText(PROJECTS.network.status, 'faint');
      printGap();
      printText('Designed and documented a subnetted network topology in GNS3, then used', 'dim');
      printText('Wireshark to verify traffic behavior at each hop. Submitted early to', 'dim');
      printText('School 21 and graded 100 out of 100.', 'dim');
      printGap();
      printLink('repo: ', 'https://github.com/s1nkhole/s21-project-01-networking-gns3-wireshark');
    }
  },
  mask: {
    aliases: ['voice-mask', 'mask', 'voice'],
    name: 'Voice-changer mask',
    status: 'in development',
    summary: 'Real-time voice DSP on an ESP32-S3',
    run: function () {
      printText('Voice-changer mask', 'ok');
      printText(PROJECTS.mask.status, 'faint');
      printGap();
      printText('A wearable firmware project: real-time voice DSP on an ESP32-S3. Disguises', 'dim');
      printText('the wearer\'s voice in real time and can also listen for a wake phrase,', 'dim');
      printText('photograph nearby text, translate it, and speak the translation back', 'dim');
      printText('through a small earpiece speaker. The audio chain runs a high-pass filter,', 'dim');
      printText('a pitch shift, a ring modulator, a soft clipper, and a short echo, entirely', 'dim');
      printText('on-device.', 'dim');
      printGap();
      printText('hardware: ESP32-S3, INMP441 microphone, MAX98357A amplifier, 2000 mAh battery', 'faint');
    }
  }
};

function findProject(slug) {
  var keys = Object.keys(PROJECTS);
  for (var i = 0; i < keys.length; i++) {
    var p = PROJECTS[keys[i]];
    if (p.aliases.indexOf(slug) !== -1) return p;
  }
  return null;
}

var COMMANDS = ['help', 'whoami', 'work', 'skills', 'lab', 'contact', 'clear', 'ls', 'banner'];

function cmdHelp() {
  printText('available commands', 'ok');
  printGap();
  printText('help              show this list', 'dim');
  printText('whoami            identity fields', 'dim');
  printText('work [name]       selected projects, or a specific one', 'dim');
  printText('skills            technical capabilities by area', 'dim');
  printText('lab               work in progress', 'dim');
  printText('contact           how to reach out', 'dim');
  printText('clear             clear the terminal', 'dim');
  printGap();
  printText('try: work capguardos', 'faint');
}

function cmdWhoami() {
  printKV('handle', 's1nkhole');
  printKV('sector', 'Russia // meatspace');
  printKV('faculty', 'School 21 [Sber / Ecole 42 network]');
  printKV('stage', 'cybersecurity track -- in progress');
  printKV('focus', 'capability isolation, sel4', true);
  printKV('clearance', 'redacted', true);
}

function cmdWork(args) {
  if (args.length > 0) {
    var proj = findProject(args[0].toLowerCase());
    if (proj) { proj.run(); return; }
    printText('no project matching \'' + args[0] + '\'', 'warn');
    printText('available: capguardos, uptime-monitor, network-lab, voice-mask', 'faint');
    return;
  }
  printText('selected work', 'ok');
  printGap();
  var keys = Object.keys(PROJECTS);
  for (var i = 0; i < keys.length; i++) {
    var p = PROJECTS[keys[i]];
    printText(keys[i], 'dim');
    printText('  ' + p.summary + ' -- ' + p.status, 'faint');
  }
  printGap();
  printText('type \'work <name>\' for details, e.g. work capguardos', 'faint');
}

function cmdSkills() {
  printText('capabilities', 'ok');
  printGap();
  printKV('systems', '');
  printText('  C, the seL4 microkernel, capability-based isolation, Arch Linux internals,', 'dim');
  printText('  systemd-boot with Unified Kernel Images, LUKS full-disk encryption, btrfs', 'dim');
  printKV('security', '');
  printText('  AppArmor, USBGuard, firewalld, Secure Boot signing, Wazuh, Fail2Ban, iptables', 'dim');
  printKV('networking', '');
  printText('  GNS3, VLSM subnetting, Wireshark, MikroTik', 'dim');
  printKV('firmware', '');
  printText('  ESP32-S3, embedded C, real-time audio DSP, RF and SDR tooling', 'dim');
  printKV('infra', '');
  printText('  Docker, GitHub Actions, Terraform, Prometheus and Grafana', 'dim');
}

function cmdLab() {
  printText('in the lab', 'ok');
  printText('ongoing builds without a finished write-up yet', 'faint');
  printGap();
  printText('hardened-workstation', 'dim');
  printText('  Arch Linux, two kernels side by side (stock + linux-hardened), a Landlock /', 'faint');
  printText('  Lockdown / Yama / AppArmor LSM stack, LUKS encryption, a small home SOC', 'faint');
  printGap();
  printText('cyberdeck', 'dim');
  printText('  portable diagnostics rig: Raspberry Pi 5, RTL-SDR receiver, mini oscilloscope,', 'faint');
  printText('  component tester, rugged case', 'faint');
  printGap();
  printText('exoskeleton', 'dim');
  printText('  early-stage design: ground-reaction load path, electric actuators,', 'faint');
  printText('  force-following control', 'faint');
}

function cmdContact() {
  printText('get in touch', 'ok');
  printGap();
  printText('open to: junior malware analyst / antivirus lab roles', 'dim');
  printText('and to conversations about capability-based security in general', 'dim');
  printGap();
  printLink('github: ', 'https://github.com/s1nkhole');
  printText('the one channel that\'s open -- everything else stays off this page', 'faint');
}

function cmdClear() {
  output.innerHTML = '';
}

function cmdBanner() {
  printPre('+-----------------------------+\n|  s1nkhole -- systems shell  |\n+-----------------------------+');
}

async function cmdSudo() {
  printText('s1nkhole is not in the sudoers file. this incident will be reported.', 'warn');
}

async function cmdDecrypt() {
  printText('attempting decryption...', 'dim');
  var bar = document.createElement('div');
  bar.className = 'line dim';
  output.appendChild(bar);
  scrollDown();
  var stages = ['[#....................] 5%', '[######...............] 30%', '[#############.........] 65%', '[####################] 100%'];
  for (var i = 0; i < stages.length; i++) {
    bar.textContent = stages[i];
    if (!reduceMotion) { await wait(260); }
  }
  printText('result: nice try. clearance stays redacted.', 'warn');
}

async function runCommand(raw) {
  var trimmed = raw.trim();
  var echo = document.createElement('div');
  echo.className = 'line echo';
  var ps1 = document.createElement('span');
  ps1.className = 'ps1';
  ps1.textContent = 'guest@s1nkhole:~$ ';
  echo.appendChild(ps1);
  echo.appendChild(document.createTextNode(raw));
  output.appendChild(echo);
  scrollDown();

  if (trimmed === '') { return; }

  var parts = trimmed.split(/\s+/);
  var name = parts[0].toLowerCase();
  var args = parts.slice(1);

  if (name === 'sudo') { await cmdSudo(); }
  else if (name === 'decrypt') { await cmdDecrypt(); }
  else if (name === 'help' || name === 'ls') { cmdHelp(); }
  else if (name === 'whoami') { cmdWhoami(); }
  else if (name === 'work') { cmdWork(args); }
  else if (name === 'skills') { cmdSkills(); }
  else if (name === 'lab') { cmdLab(); }
  else if (name === 'contact') { cmdContact(); }
  else if (name === 'clear') { cmdClear(); }
  else if (name === 'banner') { cmdBanner(); }
  else {
    printText('command not found: ' + name, 'warn');
    printText('type \'help\' for a list of commands', 'faint');
  }
  printGap();
}

input.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') {
    var val = input.value;
    history.push(val);
    historyIndex = history.length;
    input.value = '';
    runCommand(val);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (historyIndex > 0) {
      historyIndex--;
      input.value = history[historyIndex];
    }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (historyIndex < history.length - 1) {
      historyIndex++;
      input.value = history[historyIndex];
    } else {
      historyIndex = history.length;
      input.value = '';
    }
  } else if (e.key === 'Tab') {
    e.preventDefault();
    var partial = input.value.toLowerCase();
    if (partial === '') { return; }
    var matches = COMMANDS.filter(function (c) { return c.indexOf(partial) === 0; });
    if (matches.length === 1) { input.value = matches[0]; }
  }
});

document.querySelectorAll('.term-chips button').forEach(function (btn) {
  btn.addEventListener('click', function () {
    input.value = btn.getAttribute('data-cmd');
    input.focus();
  });
});

document.querySelector('.term-window').addEventListener('click', function () {
  input.focus();
});

async function boot() {
  var lines = [
    ['[ ok ] establishing session...', 'dim'],
    ['[ ok ] loading identity: s1nkhole', 'dim'],
    ['[ ok ] sector: Russia // meatspace', 'dim'],
    ['[ ok ] faculty: School 21 [Sber / Ecole 42 network]', 'dim'],
    ['[ ok ] stage: cybersecurity track -- in progress', 'dim'],
    ['[ ok ] clearance: redacted', 'dim']
  ];
  for (var i = 0; i < lines.length; i++) {
    printText(lines[i][0], lines[i][1]);
    if (!reduceMotion) { await wait(180); }
  }
  printGap();
  cmdBanner();
  printGap();
  printText('type \'help\' to see available commands', 'faint');
  printGap();
  cmdHelp();
  printGap();
  input.focus();
}

boot();
</script>
</body>
</html>
